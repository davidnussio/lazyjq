# Demo style (Dracula colors). Everything else follows the built-in defaults.

[history]
# Don't touch the history of whoever records the demo
persist = false

[theme]
active_border = "fg=#50FA7B,attr=bold"
inactive_border = "fg=#6272A4"
selected_line = "fg=#282A36,bg=#BD93F9,attr=bold"
inactive_selected_line = "fg=#BD93F9,attr=bold"
hint_key = "fg=#8BE9FD"
dim = "fg=#6272A4"

[editor]
prompt = "jq ❯ "
prompt_style = "fg=#50FA7B,attr=bold"

[json]
indent = 2
bracket_style = "fg=#F8F8F2,attr=bold"
key_style = "fg=#FF79C6"
string_value_style = "fg=#F1FA8C"
number_value_style = "fg=#BD93F9"
boolean_value_style = "fg=#BD93F9"
null_value_style = "fg=grey"

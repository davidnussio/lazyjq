# lazyjq configuration
#
# This file is merged on top of the built-in defaults:
# you can delete any setting you don't want to change.

# Whether to hide the keybinding hints in the bottom bar
no_hint = false

# Style notation (termcfg)
# Format: "fg=<color>,bg=<color>,ul=<color>,attr=<token|token...>"
# Examples:
# - "fg=blue"
# - "fg=#00FF00,bg=black,attr=bold|underlined"
# - "attr=dim"
#
# Color tokens:
# - reset, black, red, green, yellow, blue, magenta, cyan, white
# - darkgrey, darkred, darkgreen, darkyellow, darkblue, darkmagenta, darkcyan, grey
# - #RRGGBB
#
# Attribute tokens (examples):
# - bold, italic, underlined, dim, reverse, crossedout, nounderline, nobold
#
# References:
# - https://github.com/ynqa/termcfg/blob/main/Notations.md

# Layout
[ui]
# Width of the side panels column (Suggestions, History), in percent of the terminal width
side_panel_width = 33
# Below this terminal width the panels are stacked vertically
portrait_threshold = 80
# Border type: "Plain", "Rounded", "Double" or "Thick"
border = "Rounded"

# Colors of the panels, hints and messages
[theme]
# Border and title of the focused panel
active_border = "fg=green,attr=bold"
# Border of the other panels
inactive_border = ""
# Panel titles
title = ""
# Selected line in the focused panel
selected_line = "bg=darkblue,attr=bold"
# Selected line in the other panels
inactive_selected_line = "attr=bold"
# Keys in the hint bar and in the help popup
hint_key = "fg=blue"
# Descriptions in the hint bar
hint_text = ""
# Secondary text (counters, placeholders)
dim = "fg=darkgrey"
# Messages
success = "fg=green"
warning = "fg=yellow"
error = "fg=red"
# Headings and code in the documentation of jq functions
doc_heading = "attr=bold"
doc_code = "fg=cyan"

# Query editor
[editor]
# Prompt shown before the query
prompt = "❯ "
prompt_style = "fg=blue"
# Characters considered as word boundaries
# These are used to define word movement and deletion behavior in the editor
word_break_chars = [".", "|", "(", ")", "[", "]", " "]

# JSON display settings
[json]
# Maximum number of JSON objects to read from streams (e.g., JSON Lines format)
# Limits how many objects are processed to reduce memory usage when handling large data streams
# No limit if unset
# max_streams =

# Number of spaces to use for indentation
indent = 2
# Style for curly and square brackets
bracket_style = "attr=bold"
# Style for JSON keys
key_style = "fg=cyan"
# Style for string values
string_value_style = "fg=green"
# Style for number values
number_value_style = ""
# Style for boolean values
boolean_value_style = "fg=magenta"
# Style for null values
null_value_style = "fg=grey"

# Suggestions panel
[completion]
# Maximum number of path suggestions listed
max_suggestions = 1000
# Maximum number of distinct values collected for value suggestions
max_value_suggestions = 10000

# History panel
[history]
# Keep the query history across sessions
persist = true
# Maximum number of queries kept
max_entries = 200

# Application reactivity settings
[reactivity_control]
# Delay after the last keystroke before the query is evaluated
query_debounce_duration = "250ms"
# Interval for spinner animation updates
spin_duration = "100ms"

# Keybinding settings
#
# Bindings made only of printable characters (like "q" or "?") are ignored
# while typing in the query editor.
[keybinds.global]
quit = ["q"]
force_quit = ["Ctrl+C"]
help = ["?", "F1"]
copy_query = ["Ctrl+Q"]
copy_result = ["Ctrl+Y"]
# Save the result to a file (asks for the path)
save_result = ["Ctrl+S"]
# Open another JSON file in place of the input, keeping the query (asks for the path)
open_file = ["Ctrl+O"]
focus_query = ["1", "/", "i"]
focus_suggestions = ["2"]
focus_history = ["3"]
focus_result = ["4"]
next_panel = ["Right"]
previous_panel = ["Left"]

# Query editor
[keybinds.query]
# Evaluate the query now, save it to the history and focus the result
submit = ["Enter"]
# Focus the result without saving the query
leave = ["Esc", "Shift+Down"]
# Complete the query from the Suggestions panel
complete = ["Tab"]
# Browse the history
history_previous = ["Up"]
history_next = ["Down"]
backward = ["Left"]
forward = ["Right"]
move_to_head = ["Ctrl+A", "Home"]
move_to_tail = ["Ctrl+E", "End"]
move_to_previous_word = ["Alt+B", "Ctrl+Left"]
move_to_next_word = ["Alt+F", "Ctrl+Right"]
erase = ["Backspace"]
erase_forward = ["Delete", "Ctrl+D"]
erase_all = ["Ctrl+U"]
erase_to_previous_word = ["Ctrl+W", "Alt+Backspace"]
erase_to_next_word = ["Alt+D"]
erase_to_tail = ["Ctrl+K"]

# Suggestions and History panels
[keybinds.list]
up = ["Up", "k", "Shift+Tab"]
down = ["Down", "j", "Tab"]
page_up = ["PageUp", "Ctrl+B"]
page_down = ["PageDown", "Ctrl+F"]
top = ["g", "Home"]
bottom = ["G", "End"]
# Put the selected item in the query
select = ["Enter"]
# Go back to the query editor (from Suggestions: restoring the query)
back = ["Esc"]
# Delete the selected history entry
delete = ["d"]

# Result panel
[keybinds.result]
up = ["Up", "k"]
down = ["Down", "j"]
page_up = ["PageUp", "Ctrl+U", "Ctrl+B"]
page_down = ["PageDown", "Ctrl+D", "Ctrl+F"]
top = ["g", "Home"]
bottom = ["G", "End"]
# Fold/unfold the selected object or array
toggle = ["Enter", "Space"]
# Unfold the selected node
expand = ["l"]
# Fold the selected node (or jump to its parent)
collapse = ["h"]
expand_all = ["e"]
collapse_all = ["c"]
# Narrow the query down to the selected node
drill_down = ["f"]
# Go back to the result before the last drill down (cursor and folds included)
drill_up = ["Backspace", "u"]
# Open the copy menu (query, result, path or value of the selected node,
# or save the result to a file)
copy_menu = ["y"]
# Go back to the query editor
back = ["Esc", "Shift+Up"]

# Popups (help, copy menu, file name prompts)
# In the file name prompts, printable keys (like "q") are typed, the query
# editor keys edit the text and `complete` completes the file name; while
# going through the matches, the list keys move between them.
[keybinds.popup]
up = ["Up", "k"]
down = ["Down", "j"]
select = ["Enter"]
close = ["Esc", "q"]
